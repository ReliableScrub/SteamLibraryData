name: Build Linux and macOS

on:
  workflow_dispatch:

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Create fresh Linux deploy configuration
        run: |
          rm -f pysidedeploy.spec
          pyside6-deploy main.py --init -f

      - name: Build Linux application
        run: pyside6-deploy -f

      - name: Package Linux application
        run: |
          chmod +x dist/SteamLibraryData.bin
          tar -czf SteamLibraryData-linux-x64.tar.gz \
            -C dist SteamLibraryData.bin

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: SteamLibraryData-linux-x64
          path: SteamLibraryData-linux-x64.tar.gz


  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64

          - runner: macos-15-intel
            arch: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile Python
        run: python -m compileall .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Create fresh macOS deploy configuration
        run: |
          rm -f pysidedeploy.spec
          pyside6-deploy main.py --init -f

      - name: Build macOS application
        run: pyside6-deploy -f

      - name: Package macOS application
        run: |
          ditto -c -k \
            --sequesterRsrc \
            --keepParent \
            dist/SteamLibraryData.app \
            SteamLibraryData-macos-${{ matrix.arch }}.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: SteamLibraryData-macos-${{ matrix.arch }}
          path: SteamLibraryData-macos-${{ matrix.arch }}.zip